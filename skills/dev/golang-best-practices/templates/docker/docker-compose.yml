---
# 按需使用：默认仅 app；database/cache profile 只增加对应依赖服务。
services:
  app:
    image: ${IMAGE_NAME:-go-app}:${IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: templates/docker/Dockerfile
      args:
        GO_IMAGE: ${GO_IMAGE:?Set GO_IMAGE to match the project's Go version}
        MAIN_PACKAGE: ${MAIN_PACKAGE:-.}
    ports:
      - "${HOST_PORT:-8080}:${APP_PORT:-8080}"
    environment:
      PORT: ${APP_PORT:-8080}

  db:
    profiles: [database]
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
      POSTGRES_DB: ${DB_NAME:-app}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    profiles: [cache]
    image: ${REDIS_IMAGE:-redis:7-alpine}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - >-
        exec redis-server --appendonly yes --requirepass
        "$${REDIS_PASSWORD:?Set REDIS_PASSWORD before enabling cache}"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG'
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  redis-data:
